name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.1'

jobs:
  quality:
    name: Lint, typecheck, teste unitare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Regula de dependente intre pachete se verifica aici si e blocanta.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Teste unitare
        run: pnpm test

  database:
    name: Teste de baza de date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Testcontainers porneste un Postgres efemer si aplica migratiile de la
      # zero. Runner-ul GitHub are Docker inclus, deci nu e nevoie de nimic local.
      - name: Migratii de la zero + roluri + withActor
        run: pnpm test:db

  build:
    name: Build si scan de secrete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Valori false, doar ca build-ul sa treaca. Scanul de mai jos verifica
          # exact ca ele NU ajung in bundle-ul de client.
          SUPABASE_SERVICE_ROLE_KEY: sb-fake-service-role-key-for-ci-only
          R2_ACCESS_KEY_ID: fake-r2-access-key-id-ci
          R2_SECRET_ACCESS_KEY: fake-r2-secret-access-key-ci
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          DATABASE_URL_SESSION: postgresql://fake:fake@localhost:5432/fake

      - name: Scan de secrete in bundle-ul de client
        run: pnpm scan:secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: sb-fake-service-role-key-for-ci-only
          R2_ACCESS_KEY_ID: fake-r2-access-key-id-ci
          R2_SECRET_ACCESS_KEY: fake-r2-secret-access-key-ci
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          DATABASE_URL_SESSION: postgresql://fake:fake@localhost:5432/fake

  taps:
    name: Bugetul de tapuri (teren)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # FARA `--with-deps`, si asta e o cicatrice: varianta cu el a picat de doua
      # ori, si nu din vina Playwright. `--with-deps` cheama `apt-get update`, iar
      # oglinda `azure.archive.ubuntu.com` a runner-ului n-a raspuns — zece minute
      # de `Ign:` in bucla, apoi timeout. Imaginea `ubuntu-latest` are deja
      # bibliotecile de care are nevoie Chromium (vine cu Chrome instalat), deci
      # tot ce trebuie descarcat e binarul, de pe CDN-ul Playwright.
      - name: Chromium
        run: pnpm exec playwright install chromium
        timeout-minutes: 10

      # Blocant dinadins (pasul 10, §0). Daca seful de santier are nevoie de 7
      # tapuri ca sa comande material, da telefon la magazie si trasabilitatea
      # ramane goala — o cerinta de UX fara masuratoare dispare la a treia
      # iteratie. Jobul NU are baza de date: masoara ecranul, nu datele.
      - name: Teste de tapuri
        run: pnpm e2e
        env:
          CI: 'true'
          # Aceleasi valori false ca la build: fara ele, `next build` cade la
          # validarea de mediu. Nimic din ele nu e chemat — jobul n-atinge nici
          # baza, nici R2.
          SUPABASE_SERVICE_ROLE_KEY: sb-fake-service-role-key-for-ci-only
          R2_ACCESS_KEY_ID: fake-r2-access-key-id-ci
          R2_SECRET_ACCESS_KEY: fake-r2-secret-access-key-ci
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          DATABASE_URL_SESSION: postgresql://fake:fake@localhost:5432/fake

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: urme-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Audit de dependente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocant pe severitate `high` si mai sus.
      - name: pnpm audit
        run: pnpm audit --audit-level high
